services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "if [ ! -d node_modules/mongoose ]; then npm ci --ignore-scripts; fi; npm run dev"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/credify
      JWT_SECRET: ${JWT_SECRET:-local-development-only-change-before-sharing}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-7d}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-12}
      CORS_ORIGIN: http://localhost:5173
      FRONTEND_URL: http://localhost:5173
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-manual}
      PAYMENT_CURRENCY: ${PAYMENT_CURRENCY:-GHS}
      PAYMENT_CALLBACK_URL: ${PAYMENT_CALLBACK_URL:-http://localhost:5000/api/payments/callback}
      PAYSTACK_BASE_URL: ${PAYSTACK_BASE_URL:-https://api.paystack.co}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY:-}
      PAYSTACK_WEBHOOK_SECRET: ${PAYSTACK_WEBHOOK_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@credify.local}
    ports:
      - "5000:5000"
    volumes:
      - ../credify_backend/package.json:/app/package.json:ro
      - ../credify_backend/package-lock.json:/app/package-lock.json:ro
      - ../credify_backend/server.js:/app/server.js
      - ../credify_backend/config:/app/config
      - ../credify_backend/src:/app/src
      - backend_node_modules:/app/node_modules
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "if [ ! -x node_modules/.bin/vite ]; then npm ci --ignore-scripts; fi; npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:5000/api
      VITE_USE_POLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./package.json:/app/package.json:ro
      - ./package-lock.json:/app/package-lock.json:ro
      - ./index.html:/app/index.html
      - ./vite.config.js:/app/vite.config.js
      - ./public:/app/public
      - ./src:/app/src
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo_data:
  backend_node_modules:
  frontend_node_modules:
